# Curated to 3 personal-brand finance pages (2026-05-25 pivot).
# Removed: corporate/media brands (AARP, NerdWallet, Penny Hoarder, Kiplinger,
# Motley Fool, Money Talks News, Clark Howard, Boldin, Medicare Mama, IWT)
# — lower engagement per post + less of the "personality voice" we want to mimic.
# Also removed Dave Ramsey: too dominant — was monopolizing 15/15 top-velocity
# slots with general/motivational content, crowding out finance-specific
# inspirations from smaller pages we actually want to learn from.
pages:
  - name: Josh Rincon
    handle: joshrinconofficial  # corrected from earlier 'joshrincon' which returned no posts
    rank: anchor
    notes: Personal finance educator with sensational packaging style — the voice model going forward.
  - name: Good Financial Cents
    handle: GoodFinancialCents
    rank: primary
    notes: Personal-brand finance page. Educational + personal voice, well-engaged.
  - name: Suze Orman
    handle: suzeorman
    rank: high_engagement
    notes: Broad finance + money psychology. High-engagement legacy voice.

scrape_settings:
  per_page_post_count: 30
  date_range_days: 14
  rank_by: engagement_velocity_per_competitor
  velocity_formula: "(likes + 2*comments + 3*shares) / max(hours_since_posted, 1)"
  # Take top N PER competitor (not top N overall) — prevents any single high-audience
  # page from monopolizing the source pool. Was a real bug pre-2026-05-25: Dave Ramsey
  # took ALL 15 of the top-15-by-velocity slots, so model only ever saw his content.
  top_n_per_competitor: 5
  top_n_overall_cap: 25
