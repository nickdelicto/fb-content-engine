scrape_settings:
  per_page_post_count: 30
  date_range_days: 14
  rank_by: engagement_velocity
  velocity_formula: "(likes + 2*comments + 3*shares) / max(hours_since_posted, 1)"
  top_n_to_pass_to_prompt: 15
